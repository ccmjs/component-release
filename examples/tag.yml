name: Build & Tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Component version, e.g. 1.0.0'
        required: true
        type: string
      dry-run:
        description: Build without publishing a tag
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  release:
    # Replace BOTH references with an existing release tag or the same full commit SHA.
    uses: ccmjs/component-release/.github/workflows/release.yml@v1.0.0
    with:
      tooling-ref: v1.0.0
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
